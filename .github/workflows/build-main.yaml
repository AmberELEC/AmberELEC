name: build-main
on:
  repository_dispatch:
    types: [release-beta, release-prerelease, release-draft, release-dev]
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'LICENSE.md'
      - 'Dockerfile'
      - '.dockerignore'
    branches:
      - main
      - dev

concurrency:
  group: main

env:
  DOCKER_IMAGE: ghcr.io/${{ github.event.repository.owner.login }}/${{ github.event.repository.name }}-build:latest

jobs:
  build-init:
    timeout-minutes: 60
    runs-on: main
    steps:
      - name: Prune Dangling Docker Resources
        run: |
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f --keep-storage 20GB || true

      - name: Get current branch as it may not be 'default branch'
        id: branch
        run: |
          branch_arg="${{ github.event.client_payload.branch }}"
          if [[ -z "$branch_arg" ]]; then
            branch_arg="$GITHUB_REF_NAME"
          fi
          echo "branch=$branch_arg" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        name: Checkout
        with:
          clean: false
          ref: "${{ steps.branch.outputs.branch }}"

  build-toolchain-rk3326:
    needs: [build-init]
    timeout-minutes: 360
    runs-on: main
    steps:
      - name: Build Toolchain RK3326
        run: |
          set -e
          make DOCKER_WORK_DIR=/work docker-toolchain-RK3326

  build-rg351p:
    needs: [build-toolchain-rk3326]
    timeout-minutes: 360
    runs-on: main
    steps:
      - name: Get date for artifacts
        id: date
        run: echo "date=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT
      - name: Get short SHA for artifacts
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Get dev (or draft release) version
        id: version
        run: |
          set -e
          if [[ "${{ github.event.client_payload.release_tag }}" != "" ]]; then
            echo "version=${{ github.event.client_payload.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build RG351P
        run: |
          set -e
          rm -rf release/aarch64/RG351P
          mkdir -p release/aarch64/RG351P
          export CUSTOM_VERSION="${{ steps.version.outputs.version }}"
          make DOCKER_WORK_DIR=/work docker-RG351P
      - name: Cleanup unwanted image/kernel artifacts early
        run: |
          set -e
          rm -rf release/aarch64/RG351P/*.system*
          rm -rf release/aarch64/RG351P/*.kernel*
          if [[ "${{ github.event.client_payload.release_tag }}" == "" ]]; then
            rm -rf release/aarch64/RG351P/*.img.gz*
          fi
      - name: Archive RG351P (${{ github.sha }})
        uses: actions/upload-artifact@v7
        with:
          name: RG351P-dev-main-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}
          path: |
            release/aarch64/RG351P/*.tar*
            release/aarch64/RG351P/*.img.gz*
      - name: Delete local RG351P release output to free disk
        run: rm -rf release/aarch64/RG351P/

  build-rg351v:
    needs: [build-toolchain-rk3326, build-rg351p]
    timeout-minutes: 360
    runs-on: main
    steps:
      - name: Get date for artifacts
        id: date
        run: echo "date=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT
      - name: Get short SHA for artifacts
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Get dev (or draft release) version
        id: version
        run: |
          set -e
          if [[ "${{ github.event.client_payload.release_tag }}" != "" ]]; then
            echo "version=${{ github.event.client_payload.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build RG351V
        run: |
          set -e
          rm -rf release/aarch64/RG351V
          mkdir -p release/aarch64/RG351V
          export CUSTOM_VERSION="${{ steps.version.outputs.version }}"
          make DOCKER_WORK_DIR=/work docker-RG351V
      - name: Cleanup unwanted image/kernel artifacts early
        run: |
          set -e
          rm -rf release/aarch64/RG351V/*.system*
          rm -rf release/aarch64/RG351V/*.kernel*
          if [[ "${{ github.event.client_payload.release_tag }}" == "" ]]; then
            rm -rf release/aarch64/RG351V/*.img.gz*
          fi
      - name: Archive RG351V (${{ github.sha }})
        uses: actions/upload-artifact@v7
        with:
          name: RG351V-dev-main-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}
          path: |
            release/aarch64/RG351V/*.tar*
            release/aarch64/RG351V/*.img.gz*
      - name: Delete local RG351V release output to free disk
        run: rm -rf release/aarch64/RG351V/

  build-rg351mp:
    needs: [build-toolchain-rk3326, build-rg351p, build-rg351v]
    timeout-minutes: 360
    runs-on: main
    steps:
      - name: Get date for artifacts
        id: date
        run: echo "date=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT
      - name: Get short SHA for artifacts
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Get dev (or draft release) version
        id: version
        run: |
          set -e
          if [[ "${{ github.event.client_payload.release_tag }}" != "" ]]; then
            echo "version=${{ github.event.client_payload.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}" >> $GITHUB_OUTPUT
