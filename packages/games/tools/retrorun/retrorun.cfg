# ---- RETRORUN INTERNAL SETTINGS ----
retrorun_screenshot_folder = /storage/roms/screenshots
retrorun_decoration_source = auto
retrorun_show_loading_screen = false
retrorun_log_level = ERROR
retrorun_video_renderer = auto
retrorun_force_video_multithread = false
retrorun_loop_declared_fps = true
retrorun_adaptive_frameskip = false
retrorun_frameskip = 0
retrorun_audio_backend = go2
retrorun_audio_buffer = -1
retrorun_audio_stable_buffer = false
retrorun_force_audio_multithread = false
retrorun_go2_audio_stretch_percent = 0
retrorun_go2_audio_stretch_low_ms = 40
retrorun_sdl_audio_stretch_percent = 0
retrorun_sdl_audio_stretch_low_ms = 40
retrorun_flycast2021le_game_profile = best_performance
retrorun_flycast_catalog_update = auto

# ---- RETROACHIEVEMENTS ----
retrorun_achievements_enabled = false
retrorun_achievements_username =
retrorun_achievements_password =
retrorun_achievements_token =
retrorun_achievements_unofficial = false
retrorun_achievements_encore = false
# ---- FLYCAST ----
flycast_threaded_rendering = enabled
flycast_internal_resolution = 640x480
flycast_anisotropic_filtering = off
flycast_enable_dsp = disabled
flycast_synchronous_rendering = disabled
flycast_enable_rtt = disabled
flycast_enable_rttb = disabled
flycast_delay_frame_swapping = disabled
# Alpha sorting should be set to per strip
flycast_alpha_sorting = per-strip (fast, least accurate)
flycast_div_matching = auto
# Texupscale should be off
flycast_texupscale = off
# Vibration support should be on
flycast_enable_purupuru = enabled
flycast_auto_skip_frame = disabled
flycast_gdrom_fast_loading = enabled
flycast_volume_modifier_enable = disabled
flycast_framerate = fullspeed
# ---- FLYCAST 2021 ----
flycast2021_threaded_rendering = enabled
flycast2021_internal_resolution = 640x480
flycast2021_anisotropic_filtering = off
flycast2021_enable_dsp = disabled
flycast2021_synchronous_rendering = disabled
flycast2021_enable_rtt = disabled
flycast2021_enable_rttb = disabled
flycast2021_delay_frame_swapping = disabled
# Alpha sorting should be set to per strip
flycast2021_alpha_sorting = per-strip (fast, least accurate)
flycast2021_div_matching = auto
# Texupscale should be off
flycast2021_texupscale = off
# Vibration support should be on
flycast2021_enable_purupuru = enabled
flycast2021_gdrom_fast_loading = enabled
flycast2021_volume_modifier_enable = disabled
flycast2021_framerate = fullspeed
# ---- FLYCAST 2021 LE ----
flycast2021le_threaded_rendering = enabled
flycast2021le_internal_resolution = 640x480
flycast2021le_anisotropic_filtering = off
flycast2021le_enable_dsp = disabled
flycast2021le_synchronous_rendering = disabled
flycast2021le_enable_rttb = disabled
flycast2021le_delay_frame_swapping = disabled
# Alpha sorting should be set to per strip
flycast2021le_alpha_sorting = per-strip (fast, least accurate)
flycast2021le_div_matching = auto
# Texupscale should be off
flycast2021le_texupscale = off
# Vibration support should be on
flycast2021le_enable_purupuru = enabled
flycast2021le_gdrom_fast_loading = enabled
flycast2021le_volume_modifier_enable = disabled
flycast2021le_framerate = fullspeed
# Safe defaults; game profiles may override them.
flycast2021le_texture_storage_reuse = enabled
flycast2021le_palette_fog_storage_reuse = disabled
flycast2021le_fast_depth = disabled
flycast2021le_adjacent_state_elision = disabled
flycast2021le_translucent_strip_merge = disabled
flycast2021le_opaque_strip_merge = disabled
flycast2021le_translucent_menu_guard_strategy = all_short
flycast2021le_translucent_menu_guard_max_vertices = 4
flycast2021le_translucent_menu_guard_risk = 5
flycast2021le_translucent_menu_guard_depth_tolerance = 0.01
flycast2021le_translucent_menu_guard_overlap = risky
flycast2021le_translucent_menu_guard_draw_sorting = per_triangle
flycast2021le_shared_block_checks = disabled
flycast2021le_mmu_address_lut = disabled
flycast2021le_fmov_fpr64 = disabled
flycast2021le_sh4_cycle_mode = legacy
flycast2021le_audio_mixer = accurate
flycast2021le_aica_better_lpf = disabled
flycast2021le_aica_arm_cycles = 32
flycast2021le_accurate_aica_batch = disabled
flycast2021le_render_queue_no_drop = disabled
flycast2021le_sh4clock = 200
# ---- PARALLEL N64 ----
parallel-n64-framerate = fullspeed
parallel-n64-filtering = nearest
parallel-n64-audio-buffer-size = 1024
parallel-n64-gfxplugin-accuracy = medium
parallel-n64-screensize = 640x480
parallel-n64-gfxplugin = rice
parallel-n64-pak1 = rumble
parallel-n64-pak2 = memory
parallel-n64-pak3 = none
parallel-n64-pak4 = none 
# ---- JAGUAR ----
virtualjaguar_doom_res_hack = enabled
virtualjaguar_pal = disabled
virtualjaguar_usefastblitter = enabled
virtualjaguar_bios = enabled
# ---- PPSSPP ----
ppsspp_cpu_core = JIT
ppsspp_fast_memory = enabled
ppsspp_frameskip = 0
ppsspp_auto_frameskip = disabled
ppsspp_frameskiptype = Number of frames
ppsspp_ignore_bad_memory_access = enabled
ppsspp_internal_resolution = 480x272
ppsspp_rendering_mode = buffered
# ---- DUCKSTATION ----
duckstation_CPU.Overclock = 100
duckstation_Controller1.Type = AnalogController
# ---- SWANSTATION ----
swanstation_CPU_Overclock = 100
swanstation_GPU_Renderer = Software
# ---- RETRORUN RUNTIME SETTINGS ----
